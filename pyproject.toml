[project]
name = "immersive-library"
version = "0.1.0"
description = "A generic user asset library"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "cachetools-async>=0.0.5",
    "certifi>=2026.10.19",
    "databases>=0.9.0",
    "fastapi[standard]>=0.133.0",
    "fastapi-cache2>=0.2.2",
    "google-api-python-client>=2.184.0",
    "google-auth>=2.41.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "numpy>=2.0.2",
    "orjson>=3.11.6",
    "pillow>=13.0.0",
    "playwright>=1.50.0",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "pydantic>=2.11.10",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=6.4.0",
    "requests>=2.33.0",
    "starlette>=1.3.1",
    "filelock>=4.2.4",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
